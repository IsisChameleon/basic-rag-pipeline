name: basic-rag-pipeline-dev

services:
  api:
    build:
      context: .
      dockerfile: dev.Dockerfile
    working_dir: /workspace
    volumes:
      - .:/workspace
      - api_venv:/workspace/.venv
      - rag_data:/workspace/data
      # Persist the downloaded embedding/reranker weights across container
      # recreates so they aren't re-downloaded (~220MB) every time -- the HF
      # cache otherwise lives on the container's ephemeral writable layer.
      - hf_cache:/root/.cache/huggingface
    environment:
      RAG_DATA_DIR: /workspace/data
      # Pin the HF cache to the path backed by the hf_cache volume above,
      # regardless of the image's default HOME.
      HF_HOME: /root/.cache/huggingface
      # Optional: raises the Hugging Face Hub rate limit for downloading the
      # embedding/reranker models. Get a free "Read" token at
      # https://huggingface.co/settings/tokens and put it in a local .env
      # file (HF_TOKEN=hf_...) -- docker compose loads .env automatically,
      # and it's gitignored so it's never committed.
      HF_TOKEN: ${HF_TOKEN:-}
      # Required by /answer to call Gemini for answer generation. Put it in a
      # local .env file (GOOGLE_API_KEY=...), which is gitignored.
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    ports:
      - "${API_PORT:-8000}:8000"
    command: sh -c "uv sync --frozen && uv run uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  api_venv:
  rag_data:
  hf_cache:
